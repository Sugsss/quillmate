<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian集成 - AI内容管理系统</title>
<style>
:root { --primary: #ff2442; --bg: #fafafa; --card: #fff; --text: #333; --border: #eee; --shadow: 0 2px 12px rgba(0,0,0,0.06); --green: #38a169; --purple: #7c3aed; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:linear-gradient(135deg, #7c3aed, #a78bfa); color:#fff; padding:16px 20px; text-align:center; }
.header h1 { font-size:18px; }
.nav { display:flex; gap:4px; justify-content:center; padding:8px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.nav a { text-decoration:none; color:var(--text); padding:4px 10px; border-radius:12px; font-size:11px; border:1px solid var(--border); white-space:nowrap; }
.nav a:hover, .nav a.active { background:var(--purple); color:#fff; border-color:var(--purple); }
.container { max-width:900px; margin:0 auto; padding:20px 16px; }
.card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.btn { padding:8px 18px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
.btn-purple { background:var(--purple); color:#fff; }
.btn-purple:hover { background:#6d28d9; }
.btn-purple:disabled { opacity:.5; }
.btn-outline { background:none; border:1px solid #ddd; color:#666; }
.btn-green { background:var(--green); color:#fff; }
.status-badge { display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:600; }
.status-on { background:#e6ffed; color:var(--green); }
.status-off { background:#fff3cd; color:#dd6b20; }
.mono { font-family:monospace; font-size:12px; background:#f5f5f5; padding:4px 8px; border-radius:4px; }
input, select { padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px; }
input:focus, select:focus { outline:none; border-color:var(--purple); }
.note-list { max-height:400px; overflow-y:auto; }
.note-item { padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12px; }
.note-item:hover { background:#f5f3ff; }
.note-item .path { color:#999; font-size:10px; }
.result { background:#f9f9f9; border-radius:10px; padding:14px; margin-top:10px; font-size:13px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 22px; border-radius:8px; font-size:13px; z-index:2000; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.flow { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:24px; margin:20px 0; justify-content:center; }
.flow-box { background:var(--card); border-radius:14px; padding:20px 24px; text-align:center; box-shadow:var(--shadow); }
.flow-box .icon { font-size:32px; }
.flow-box .label { font-size:11px; color:#999; margin-top:4px; }
.flow-arrow { color:#ccc; font-size:20px; }
</style>
</head>
<body>
<div class="header"><h1>💎 Obsidian 集成</h1></div>
<div class="nav">
    <a href="/">🏠 首页</a>
    <a href="/materials/page">📚 素材库</a>
    <a href="/brand/page">👤 人设</a>
    <a href="/topics/page">💡 选题</a>
    <a href="/contents/page">✍️ 生成</a>
    <a href="/publishes/page">📤 发布</a>
    <a href="/comments/page">💬 评论</a>
    <a href="/analytics/page">📊 看板</a>
    <a href="/xhs/page">🔗 XHS</a>
    <a href="/obsidian/page" class="active">💎 Obsidian</a>
</div>
<div class="container">
    <!-- 连接状态 -->
    <div class="card">
        <h2 style="font-size:15px;margin-bottom:8px;">📡 连接状态</h2>
        <div id="statusArea"><span class="status-badge status-off">检查中...</span></div>
        <div id="setupGuide" style="font-size:12px;color:#666;margin-top:8px;"></div>
    </div>

    <!-- 工作流示意 -->
    <div class="flow" style="margin:16px 0;">
        <div class="flow-box">
            <div class="icon">📝</div>
            <div class="label">Obsidian<br>笔记</div>
        </div>
        <span class="flow-arrow">→</span>
        <div class="flow-box">
            <div class="icon">📥</div>
            <div class="label">导入<br>素材库</div>
        </div>
        <span class="flow-arrow">→</span>
        <div class="flow-box">
            <div class="icon">🤖</div>
            <div class="label">AI选题<br>+生成</div>
        </div>
        <span class="flow-arrow">→</span>
        <div class="flow-box">
            <div class="icon">📤</div>
            <div class="label">写回<br>Vault</div>
        </div>
    </div>

    <!-- 操作区 -->
    <div class="card">
        <h2 style="font-size:15px;margin-bottom:10px;">📥 从 Vault 导入素材</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <select id="folderSelect" style="flex:1;min-width:150px;">
                <option value="">整个 Vault</option>
                <option value="00-Inbox">00-Inbox</option>
                <option value="10-Resources">10-Resources</option>
                <option value="20-Projects">20-Projects</option>
                <option value="30-Output">30-Output</option>
                <option value="40-Archive">40-Archive</option>
            </select>
            <button class="btn btn-purple" onclick="importNotes()">📥 导入到素材库</button>
            <button class="btn btn-outline" onclick="browseNotes()">📋 浏览笔记</button>
        </div>
        <div id="importResult" class="result" style="display:none;"></div>
    </div>

    <!-- 笔记浏览 -->
    <div class="card" id="browseCard" style="display:none;">
        <h2 style="font-size:15px;margin-bottom:10px;">📋 Vault 笔记浏览</h2>
        <div class="note-list" id="noteList"></div>
        <div id="noteDetail" class="result" style="display:none;"></div>
    </div>

    <!-- 内容导出 -->
    <div class="card">
        <h2 style="font-size:15px;margin-bottom:10px;">📤 导出内容到 Vault</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <select id="contentSelect" style="flex:1;min-width:200px;">
                <option value="">选择已生成的内容</option>
            </select>
            <select id="outputFolder" style="width:140px;">
                <option value="30-Output">30-Output</option>
                <option value="20-Projects">20-Projects</option>
            </select>
            <button class="btn btn-green" onclick="exportToVault()">📤 写回 Obsidian</button>
        </div>
        <div id="exportResult" class="result" style="display:none;"></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
async function init() {
    // 检查连接状态
    try {
        const res = await fetch('/obsidian/status');
        const data = await res.json();
        const area = document.getElementById('statusArea');
        if (data.enabled && data.api?.connected) {
            area.innerHTML = `<span class="status-badge status-on">✅ 已连接 — ${data.vault_path}</span>`;
        } else if (data.enabled) {
            area.innerHTML = `<span class="status-badge status-off">⚠️ Vault路径已配置，但API未连接</span>`;
            document.getElementById('setupGuide').innerHTML = data.api?.setup || '';
        } else {
            area.innerHTML = `<span class="status-badge status-off">❌ 未配置</span>`;
            document.getElementById('setupGuide').innerHTML = `
                <details><summary style="cursor:pointer;color:var(--purple);font-weight:600;">📖 如何配置？</summary>
                <div style="margin-top:8px;line-height:1.8;">
                <strong>第一步：装插件</strong><br>
                Obsidian → 设置 → 第三方插件 → 社区插件市场 → 搜索 <code>Local REST API</code> → 安装并启用<br><br>
                <strong>第二步：配路径</strong><br>
                在项目 <code>.env</code> 中添加：<br>
                <code>OBSIDIAN_VAULT=/你的Obsidian仓库路径</code><br>
                <code>OBSIDIAN_API_URL=http://127.0.0.1:27124</code>
                </div></details>`;
        }
    } catch (err) { document.getElementById('statusArea').innerHTML = '<span class="status-badge status-off">❌ 服务异常</span>'; }

    // 加载内容列表供导出选择
    try {
        const res = await fetch('/contents/list');
        const contents = await res.json();
        const sel = document.getElementById('contentSelect');
        contents.forEach(c => { sel.innerHTML += `<option value="${c.id}">${esc(c.title)}</option>`; });
    } catch (err) {}
}
init();

async function importNotes() {
    const folder = document.getElementById('folderSelect').value;
    const container = document.getElementById('importResult');
    container.style.display = 'block';
    container.textContent = '导入中...';
    try {
        const body = folder ? { folder } : { all: true, limit: 50 };
        const res = await fetch('/obsidian/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        container.innerHTML = `✅ 导入完成：新增 <strong>${data.imported}</strong> 条，跳过 ${data.skipped} 条（已存在）`;
    } catch (err) { container.textContent = '❌ 导入失败'; }
}

async function browseNotes() {
    const card = document.getElementById('browseCard');
    card.style.display = 'block';
    const list = document.getElementById('noteList');
    list.innerHTML = '<div style="color:#999;">加载中...</div>';
    try {
        const res = await fetch('/obsidian/notes');
        const data = await res.json();
        list.innerHTML = data.notes.slice(0, 50).map(n =>
            `<div class="note-item" onclick="viewNote('${esc(n)}')">📄 ${esc(n.split('/').pop())}<span class="path"> — ${esc(n)}</span></div>`
        ).join('');
    } catch (err) { list.innerHTML = '<div style="color:#e53e3e;">加载失败</div>'; }
}

async function viewNote(path) {
    try {
        const res = await fetch('/obsidian/notes/' + encodeURIComponent(path));
        const data = await res.json();
        const detail = document.getElementById('noteDetail');
        detail.style.display = 'block';
        detail.innerHTML = `
            <strong>${esc(data.title)}</strong>
            <div style="font-size:11px;color:#999;">${esc(data.folder)} · ${data.word_count}字 · 标签: ${(data.tags||[]).map(t=>'#'+t).join(' ')}</div>
            <div style="margin-top:8px;white-space:pre-wrap;max-height:200px;overflow-y:auto;font-size:12px;line-height:1.8;">${esc(data.content).slice(0,500)}</div>
        `;
    } catch (err) {}
}

async function exportToVault() {
    const cid = document.getElementById('contentSelect').value;
    const folder = document.getElementById('outputFolder').value;
    if (!cid) { showToast('请选择内容'); return; }
    const container = document.getElementById('exportResult');
    container.style.display = 'block';
    container.textContent = '导出中...';
    try {
        const res = await fetch('/obsidian/export', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content_id: cid, folder }),
        });
        const data = await res.json();
        if (data.created) {
            container.innerHTML = `✅ 已保存到 Obsidian: <code>${esc(data.path)}</code>`;
        } else {
            container.innerHTML = `❌ ${data.error || '导出失败'}`;
        }
    } catch (err) { container.textContent = '❌ 导出失败'; }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
</script>
</body>
</html>
