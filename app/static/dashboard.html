<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 - 小红书AI内容管理系统</title>
<style>
:root { --primary: #ff2442; --bg: #fafafa; --card: #fff; --text: #333; --border: #eee; --shadow: 0 2px 12px rgba(0,0,0,0.06); --green: #38a169; --blue: #3182ce; --orange: #dd6b20; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:linear-gradient(135deg, #ff2442, #ff6b81); color:#fff; padding:14px 20px; text-align:center; }
.header h1 { font-size:17px; font-weight:700; }
.nav { display:flex; gap:3px; justify-content:center; padding:6px 8px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.nav a { text-decoration:none; color:var(--text); padding:3px 9px; border-radius:11px; font-size:11px; border:1px solid var(--border); white-space:nowrap; transition:all .15s; }
.nav a:hover, .nav a.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.container { max-width:960px; margin:0 auto; padding:20px 16px; }

/* KPI 卡片 - 借鉴 data-pro 风格 */
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
.kpi-card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.04); position:relative; overflow:hidden; }
.kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.kpi-card.views::before { background:var(--primary); }
.kpi-card.likes::before { background:var(--green); }
.kpi-card.comments::before { background:var(--blue); }
.kpi-card.collects::before { background:var(--orange); }
.kpi-card.rate::before { background:#9b59b6; }
.kpi-card .kpi-value { font-size:30px; font-weight:800; letter-spacing:-1px; }
.kpi-card .kpi-label { font-size:11px; color:#999; margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
.kpi-card .kpi-sub { font-size:10px; color:#bbb; margin-top:2px; }

/* 排行表格 - 借鉴 Financial Times 风格 */
.card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.card-header h2 { font-size:15px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { text-align:left; padding:8px 10px; border-bottom:2px solid #333; color:#666; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
tbody td { padding:10px; border-bottom:1px solid #f0f0f0; }
tbody tr:hover { background:#fafafa; }
.rank-num { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; font-size:11px; font-weight:700; background:#f5f5f5; color:#999; }
tr:nth-child(1) .rank-num { background:#ffd700; color:#fff; }
tr:nth-child(2) .rank-num { background:#c0c0c0; color:#fff; }
tr:nth-child(3) .rank-num { background:#cd7f32; color:#fff; }
.bar-cell { position:relative; }
.bar-bg { position:absolute; left:0; top:0; bottom:0; background:rgba(255,36,66,0.08); border-radius:0 4px 4px 0; z-index:0; }
.bar-val { position:relative; z-index:1; }
.empty { text-align:center; padding:50px 20px; color:#ccc; }
.loading { text-align:center; padding:30px; color:#999; }
</style>
</head>
<body>
<div class="header"><h1>📊 数据看板</h1></div>
<div class="nav">
    <a href="/">🏠 首页</a>
    <a href="/materials/page">💎 知识库</a>
    <a href="/brand/page">👤 人设</a>
    <a href="/topics/page">💡 选题</a>
    <a href="/contents/page">✍️ 生成</a>
    <a href="/publishes/page">📤 发布</a>
    <a href="/comments/page">💬 评论</a>
    <a href="/analytics/page" class="active">📊 看板</a>
    <a href="/xhs/page">🔗 XHS</a>
</div>
<div class="container">
    <!-- KPI 概览 -->
    <div class="kpi-row">
        <div class="kpi-card views">
            <div class="kpi-value" id="kpiPublishes">-</div>
            <div class="kpi-label">总发布数</div>
        </div>
        <div class="kpi-card likes">
            <div class="kpi-value" id="kpiViews">-</div>
            <div class="kpi-label">总浏览量</div>
        </div>
        <div class="kpi-card comments">
            <div class="kpi-value" id="kpiLikes">-</div>
            <div class="kpi-label">总点赞</div>
        </div>
        <div class="kpi-card collects">
            <div class="kpi-value" id="kpiCollects">-</div>
            <div class="kpi-label">总收藏</div>
        </div>
        <div class="kpi-card rate">
            <div class="kpi-value" id="kpiRate">-</div>
            <div class="kpi-label">互动率</div>
        </div>
    </div>

    <!-- 内容排行 -->
    <div class="card">
        <div class="card-header">
            <h2>📈 内容表现排行</h2>
            <span style="font-size:11px;color:#999;" id="rankCount"></span>
        </div>
        <div id="rankTable"><div class="loading">加载中...</div></div>
    </div>
</div>

<script>
async function init() {
    try {
        const [dashRes, postsRes] = await Promise.all([
            fetch('/analytics/dashboard'),
            fetch('/analytics/posts'),
        ]);
        const dash = await dashRes.json();
        const posts = await postsRes.json();

        // KPI
        document.getElementById('kpiPublishes').textContent = dash.total_publishes;
        document.getElementById('kpiViews').textContent = dash.total_views.toLocaleString();
        document.getElementById('kpiLikes').textContent = dash.total_likes.toLocaleString();
        document.getElementById('kpiCollects').textContent = dash.total_collects.toLocaleString();
        document.getElementById('kpiRate').textContent = dash.engagement_rate;

        // 排行表格
        document.getElementById('rankCount').textContent = `共 ${posts.length} 篇`;
        const container = document.getElementById('rankTable');
        if (posts.length === 0) {
            container.innerHTML = '<div class="empty">还没有发布内容<br>去「文案管理」生成并发布第一篇吧 ✍️</div>';
            return;
        }

        const maxViews = Math.max(...posts.map(p => p.views), 1);
        let html = '<table><thead><tr><th>#</th><th>标题</th><th>浏览量</th><th>点赞</th><th>评论</th><th>收藏</th></tr></thead><tbody>';
        posts.forEach((p, i) => {
            const barW = (p.views / maxViews * 100).toFixed(0);
            html += `<tr>
                <td><span class="rank-num">${i+1}</span></td>
                <td>${esc(p.title)}</td>
                <td class="bar-cell"><div class="bar-bg" style="width:${barW}%"></div><span class="bar-val">${p.views.toLocaleString()}</span></td>
                <td>${p.likes.toLocaleString()}</td>
                <td>${p.comments_count}</td>
                <td>${p.collects.toLocaleString()}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (err) {
        document.getElementById('rankTable').innerHTML = '<div class="empty">加载失败</div>';
    }
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
init();
</script>
</body>
</html>
