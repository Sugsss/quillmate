<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号人设 - 小红书AI内容管理系统</title>
    <style>
        :root { --primary: #ff2442; --bg: #fafafa; --card: #fff; --text: #333; --border: #eee; --shadow: 0 2px 12px rgba(0,0,0,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
        .header { background:linear-gradient(135deg, #ff2442, #ff6b81); color:#fff; padding:14px 20px; text-align:center; }
        .header h1 { font-size:17px; font-weight:700; }
        .nav { display:flex; gap:3px; justify-content:center; padding:6px 8px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap; }
        .nav a { text-decoration:none; color:var(--text); padding:3px 9px; border-radius:11px; font-size:11px; border:1px solid var(--border); white-space:nowrap; transition:all .15s; }
        .nav a:hover { background:var(--primary); color:#fff; }
        .container { max-width:700px; margin:0 auto; padding:24px 16px; }
        .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
        label { display:block; font-weight:600; margin-bottom:6px; font-size:14px; }
        input, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:16px; transition:border .2s; }
        input:focus, textarea:focus { outline:none; border-color:var(--primary); }
        textarea { resize:vertical; min-height:100px; }
        .hint { color:#999; font-size:12px; margin-top:-12px; margin-bottom:16px; }
        .btn-primary { background:var(--primary); color:#fff; padding:10px 28px; border:none; border-radius:8px; font-size:15px; cursor:pointer; width:100%; }
        .btn-primary:hover { background:#e01e3a; }
        .saved-msg { text-align:center; color:#38a169; font-size:14px; margin-top:12px; display:none; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none; }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👤 账号人设配置</h1>
    </div>
    <div class="nav">
        <a href="/">🏠 首页</a>
        <a href="/materials/page">💎 知识库</a>
        <a href="/brand/page" class="active">👤 人设</a>
        <a href="/topics/page">💡 选题</a>
        <a href="/contents/page">✍️ 生成</a>
        <a href="/publishes/page">📤 发布</a>
        <a href="/comments/page">💬 评论</a>
        <a href="/analytics/page">📊 看板</a>
    <a href="/xhs/page">🔗 XHS</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>🎯 AI 写文案前会先读这个</h2>
            <p style="color:#999;font-size:13px;margin-bottom:20px;">
                这4个字段决定了AI生成内容的「人设」。填得越具体，文案越像你本人写的。
                借鉴 XHSSpec 的品牌配置思路。
            </p>

            <label>🧑 我是谁</label>
            <input type="text" id="identity" placeholder="例：护肤成分党博主，专注平价好物测评">
            <div class="hint">一句话描述你的账号定位，AI 会围绕这个定位来写</div>

            <label>👥 我的受众</label>
            <input type="text" id="audience" placeholder="例：25-35岁关注成分的护肤爱好者，预算有限的学生党">
            <div class="hint">你的目标读者是谁？年龄、兴趣、痛点</div>

            <label>✍️ 写作风格</label>
            <input type="text" id="tone" placeholder="例：专业但不晦涩，像跟闺蜜聊天，偶尔自嘲">
            <div class="hint">语气和风格，决定了文案的「味道」</div>

            <label>🚫 禁忌词/话题</label>
            <textarea id="taboo" placeholder="一行一个，例：&#10;绝对&#10;第一&#10;100%有效&#10;最&#10;政治敏感话题"></textarea>
            <div class="hint">这些词或话题 AI 会避免使用（小红书广告法合规）</div>

            <label>🎨 视觉风格矩阵</label>
            <div class="hint">为不同内容类型预设封面风格，生成时自动匹配。可直接修改。</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;" id="styleGrid"></div>
            <style>.style-box{background:#fff;border:1px solid #eee;border-radius:8px;padding:8px;}</style>

            <button class="btn-primary" onclick="saveProfile()">💾 保存人设</button>
            <div class="saved-msg" id="savedMsg">✅ 保存成功！</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const defaultStyles = {
            '干货教程型': {style:'手绘笔记风',bg:'#FDF6EC',main:'#D97706'},
            '洞察观点型': {style:'暗金海报风',bg:'#1A1A2E',main:'#E2B714'},
            '清单合集型': {style:'极简信息图风',bg:'#F5F5F5',main:'#4A90D9'},
            '案例拆解型': {style:'杂志纪实风',bg:'#FAFAFA',main:'#333333'},
        };
        let styleData = null;

        function renderStyles() {
            if (!styleData) styleData = {};
            const grid = document.getElementById('styleGrid');
            if (!grid) return;
            var types = Object.keys(styleData);
            if (types.length === 0) { grid.innerHTML = '<div style="color:#999;font-size:12px;">加载中...</div>'; return; }
            var html = '';
            for (var i = 0; i < types.length; i++) {
                var type = types[i], s = styleData[type] || {};
                html += '<div style="background:#fff;border:1px solid #eee;border-radius:8px;padding:8px;">';
                html += '<div style="font-size:12px;font-weight:700;margin-bottom:4px;">' + type + '</div>';
                html += '<input value="' + (s.style||'').replace(/"/g,'&quot;') + '" placeholder="风格名称" style="width:100%;padding:4px 6px;font-size:11px;margin-bottom:3px;" onchange="updateStyle(\''+type+'\',\'style\',this.value)">';
                html += '<div style="display:flex;gap:4px;align-items:center;">';
                html += '<input type="color" value="'+(s.bg||'#fff')+'" style="width:24px;height:24px;border:none;padding:0;" onchange="updateStyle(\''+type+'\',\'bg\',this.value)">';
                html += '<span style="font-size:10px;color:#999;">底色</span>';
                html += '<input type="color" value="'+(s.main||'#333')+'" style="width:24px;height:24px;border:none;padding:0;margin-left:4px;" onchange="updateStyle(\''+type+'\',\'main\',this.value)">';
                html += '<span style="font-size:10px;color:#999;">主色</span>';
                html += '</div></div>';
            }
            grid.innerHTML = html;
        }

        function updateStyle(type, key, value) {
            if (styleData && styleData[type]) styleData[type][key] = value;
        }

        async function loadProfile() {
            try {
                const res = await fetch('/brand/profile');
                const data = await res.json();
                if (data.identity) {
                    document.getElementById('identity').value = data.identity;
                    document.getElementById('audience').value = data.audience;
                    document.getElementById('tone').value = data.tone;
                    document.getElementById('taboo').value = data.taboo;
                }
                if (data.style_matrix) {
                    try { styleData = JSON.parse(data.style_matrix); } catch(e) { styleData = {...defaultStyles}; }
                } else {
                    styleData = {...defaultStyles};
                }
                renderStyles();
            } catch (err) { styleData = {...defaultStyles}; renderStyles(); }
        }

        async function saveProfile() {
            const payload = {
                identity: document.getElementById('identity').value,
                audience: document.getElementById('audience').value,
                tone: document.getElementById('tone').value,
                taboo: document.getElementById('taboo').value,
                style_matrix: JSON.stringify(styleData),
            };
            // 如果之前有保存过的 id，带上用来更新
            try {
                const check = await fetch('/brand/profile');
                const existing = await check.json();
                if (existing.id) payload.id = existing.id;
            } catch (err) { console.error('读取人设失败:', err); }

            try {
                const res = await fetch('/brand/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('savedMsg').style.display = 'block';
                    setTimeout(() => document.getElementById('savedMsg').style.display = 'none', 2000);
                    // 更新隐藏的id用于后续更新
                }
            } catch (err) {
                showToast('❌ 保存失败');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        loadProfile();
    </script>
</body>
</html>
